<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Retro Games 🕹️</h1>
        <p>A loja de jogos clássicos!</p>
        <div class="logo-containe">
        <img src="Retrogames-logo.png" alt="Retro Games Logo" class="logo-img">
    </div>
    <p>A sua loja de jogos clássicos!</p>
    </header>
    
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nosso Catálogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
        </div>
        
        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>
    
    <dialog id="modalCadastro">
        <h2>Novo Jogo</h2>
        <form id="formJogo">
            <label for="titulo_jogo">Título do Jogo</label>
            <input type="text" id="titulo_jogo" required>
            
            <label for="plataforma">Plataforma</label>
            <select id="plataforma" required>
                <option value="" disabled selected>Selecione a plataforma</option>
                <option value="SNES">SNES</option>
                <option value="Mega Drive">Mega Drive</option>
                <option value="PS1">PS1</option>
            </select>
            
            <label for="desenvolvedora">Desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>
            
            <label for="imagem">URL da Imagem do Jogo</label>
            <input type="url" id="imagem" placeholder="https://site.com" required>
            
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            
            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>
    
    <script src="script.js"></script>
</body>

</html>
